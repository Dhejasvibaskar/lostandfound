<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact • Lost &amp; Found Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <header>
    <div class="nav-bar">
      <div class="logo">Lost &amp; Found</div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="report-lost.html">Report Lost</a>
        <a href="report-found.html">Report Found</a>
        <a href="view-items.html">View Items</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <div class="nav-right">
        <button id="dark-mode-toggle" class="small-btn" type="button">Dark / Light</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <h1>Contact</h1>
      <p>This simple form lets someone send feedback in a real project. Here we just show the validation.</p>

      <section class="card">
          <form id="contact-form" novalidate>
          <div class="form-row">
            <label for="contact-name">Name *</label>
            <input type="text" id="contact-name" placeholder="How should we address you?" />
            <div id="contact-name-error" class="error"></div>
          </div>

          <div class="form-row">
            <label for="contact-email">Email *</label>
            <input type="email" id="contact-email" placeholder="name@example.com" />
            <div id="contact-email-error" class="error"></div>
          </div>

          <div class="form-row">
            <label for="contact-message">Message *</label>
            <textarea id="contact-message"
              placeholder="Questions, suggestions, or feedback about this page."></textarea>
            <div id="contact-message-error" class="error"></div>
          </div>

          <div class="form-row">
            <button type="submit" class="btn">Send message</button>
            <p class="hint">Demo only – the message is not really sent.</p>
          </div>
          </form>
        </section>
    </section>
  </main>

  <footer>
    Simple Lost &amp; Found demo – data is kept only in this browser.
  </footer>

  <script src="script.js" defer></script>
</body>

</html>
